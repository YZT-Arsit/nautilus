# RedRover short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy redrover_short
#   python run_strategy.py --config strategies/redrover_short/config.yaml
#
# Short-only weighted-price support/resistance breakout system: signals are
# BUY/SELL/HOLD and the signal->order meaning is `sell_means: short` (SELL opens
# the short, BUY covers it), same as vwm_short.
#
# NOTE: like the other Vol>0 strategies, this default config has NO execution
# block — the synthetic bar source emits volume=0 so no fills would occur. This
# config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL (volume>0), use
#   configs/backtests/redrover_short_btcusdt_1m_small.yaml

strategy: redrover_short

params:
  atr_s: 3.0
  atr_length: 10
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own ATR / support-resistance history from the live stream.
  warmup_bars: 0
  live_bars: 80

output:
  print_table: false
  record_signals: false
