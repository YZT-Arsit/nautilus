# JailBreak long — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy jailbreak_long
#   python run_strategy.py --config strategies/jailbreak_long/config.yaml
#
# Long-only price-range (channel) breakout: signals are BUY/SELL/HOLD and the
# signal->order meaning is `sell_means: flat` (BUY opens the long, SELL flattens
# it), same as obv_revisited_long.
#
# NOTE: the entry/exit gate on Vol > 0. The synthetic bar source emits volume=0,
# so no trades fire; this config still validates the full data -> features ->
# signals pipeline. For a REAL backtest with fills/PnL use
#   configs/backtests/jailbreak_long_btcusdt_1m_small.yaml

strategy: jailbreak_long

params:
  length1: 50
  length2: 30
  ips: 4.0
  atr_val: 10
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own channel / ATR history from the live stream.
  warmup_bars: 0
  live_bars: 120

output:
  print_table: false
  record_signals: false
