# Escalator short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy escalator_short
#   python run_strategy.py --config strategies/escalator_short/config.yaml
#
# Short-only MA + candlestick-pattern breakout system: signals are BUY/SELL/HOLD
# and the signal->order meaning is `sell_means: short` (SELL opens the short, BUY
# covers it), same as vwm_short.
#
# NOTE: entry gates on Vol > 0. The synthetic bar source emits volume=0, so no
# trades fire; this config still validates the full data -> features -> signals
# pipeline. For a REAL backtest with fills/PnL use
#   configs/backtests/escalator_short_btcusdt_1m_small.yaml

strategy: escalator_short

params:
  fast_length: 8
  slow_length: 40
  risk_length: 2
  profit_factor: 2.0
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own MA / channel history from the live stream.
  warmup_bars: 0
  live_bars: 160

output:
  print_table: false
  record_signals: false
