# Superman System long — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy superman_long
#   python run_strategy.py --config strategies/superman_long/config.yaml
#
# Long-only strength + momentum channel-breakout system: signals are
# BUY/SELL/HOLD and the signal->order meaning is `sell_means: flat` (BUY opens
# the long, SELL flattens it).
#
# NOTE: like the other Vol>0 strategies, this default config has NO execution
# block — the synthetic bar source emits volume=0 so no fills would occur. This
# config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL (volume>0), use
#   configs/backtests/superman_long_btcusdt_1m_small.yaml

strategy: superman_long

params:
  length: 5
  stop_len: 5
  profit_factor: 3.0
  entry_strength: 95.0
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own strength / momentum / channel history from the live stream.
  warmup_bars: 0
  live_bars: 80

output:
  print_table: false
  record_signals: false
