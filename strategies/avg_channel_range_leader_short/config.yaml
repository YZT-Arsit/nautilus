# Average-Channel Range-Leader short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy avg_channel_range_leader_short
#   python run_strategy.py --config strategies/avg_channel_range_leader_short/config.yaml
#
# Short-only displaced high/low-MA channel + range-leader breakout: signals are
# BUY/SELL/HOLD and the signal->order meaning is `sell_means: short` (SELL opens
# the short, BUY covers it), same as vwm_short.
#
# This config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL use
#   configs/backtests/avg_channel_range_leader_short_btcusdt_1m_small.yaml

strategy: avg_channel_range_leader_short

params:
  avg_len: 20
  abs_disp: 5
  exit_bar: 5
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own displaced-channel history from the live stream.
  warmup_bars: 0
  live_bars: 160

output:
  print_table: false
  record_signals: false
