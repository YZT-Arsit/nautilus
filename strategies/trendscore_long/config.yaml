# TrendScore long — default (synthetic, no-network) run configuration.
#
#   python run_strategy.py --strategy trendscore_long
#   python run_strategy.py --config strategies/trendscore_long/config.yaml
#
# Long-only system: signals are BUY/SELL/HOLD and the signal->order meaning is
# `sell_means: flat` (BUY opens the long, SELL flattens it), same as vwm_long.
#
# NOTE: like vwm_short/trendscore_short, this default config has NO execution
# block — the synthetic bar source emits volume=0 and the strategy faithfully
# requires Vol>0 to trade, so no fills would occur here anyway. This config
# validates the full data -> features -> signals pipeline. For a REAL backtest
# with fills/PnL (volume>0), use
#   configs/backtests/trendscore_long_btcusdt_1m_small.yaml

strategy: trendscore_long

params:
  look_back: 10
  ma_length: 18
  atr_length: 10
  protect_stop_atr_multi: 0.5
  trail_stop_atr_multi: 3.0
  breakeven_stop_atr_multi: 5.0
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own MA/score/ATR history from the live stream.
  warmup_bars: 0
  live_bars: 60

output:
  print_table: false
  record_signals: false
