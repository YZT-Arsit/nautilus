# Dynamic Breakout II short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy dynamic_breakout_short
#   python run_strategy.py --config strategies/dynamic_breakout_short/config.yaml
#
# Short-only adaptive Bollinger + Donchian breakout: signals are BUY/SELL/HOLD and
# the signal->order meaning is `sell_means: short` (SELL opens the short, BUY
# covers it), same as vwm_short.
#
# This config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL use
#   configs/backtests/dynamic_breakout_short_btcusdt_1m_small.yaml

strategy: dynamic_breakout_short

params:
  ceiling_amt: 60
  floor_amt: 20
  bol_band_trig: 2.0
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own adaptive Bollinger / Donchian history from the
  # live stream.
  warmup_bars: 0
  live_bars: 200

output:
  print_table: false
  record_signals: false
