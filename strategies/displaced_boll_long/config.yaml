# Displaced-Bollinger long — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy displaced_boll_long
#   python run_strategy.py --config strategies/displaced_boll_long/config.yaml
#
# Long-only displaced-Bollinger breakout: signals are BUY/SELL/HOLD and the
# signal->order meaning is `sell_means: flat` (BUY opens the long, SELL flattens
# it), same as obv_revisited_long.
#
# This config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL use
#   configs/backtests/displaced_boll_long_btcusdt_1m_small.yaml

strategy: displaced_boll_long

params:
  avg_len: 3
  disp: 16
  sd_len: 12
  sdev: 2.0
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own displaced-Bollinger history from the live stream.
  warmup_bars: 0
  live_bars: 160

output:
  print_table: false
  record_signals: false
