# Dynamic Breakout II long — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy dynamic_breakout_long
#   python run_strategy.py --config strategies/dynamic_breakout_long/config.yaml
#
# Long-only adaptive Bollinger + Donchian breakout: signals are BUY/SELL/HOLD and
# the signal->order meaning is `sell_means: flat` (BUY opens the long, SELL
# flattens it), same as obv_revisited_long.
#
# This config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL use
#   configs/backtests/dynamic_breakout_long_btcusdt_1m_small.yaml

strategy: dynamic_breakout_long

params:
  ceiling_amt: 60
  floor_amt: 20
  bol_band_trig: 2.0
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own adaptive Bollinger / Donchian history from the
  # live stream.
  warmup_bars: 0
  live_bars: 200

output:
  print_table: false
  record_signals: false
