# Going in Style short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy going_in_style_short
#   python run_strategy.py --config strategies/going_in_style_short/config.yaml
#
# Short-only new-low-pullback entry with a parabolic-SAR trailing stop: signals
# are BUY/SELL/HOLD and the signal->order meaning is `sell_means: short` (SELL
# opens the short, BUY covers it), same as vwm_short.
#
# NOTE: the entry/exit gate on Vol > 0. The synthetic bar source emits volume=0,
# so no trades fire; this config still validates the full data -> features ->
# signals pipeline. For a REAL backtest with fills/PnL use
#   configs/backtests/going_in_style_short_btcusdt_1m_small.yaml

strategy: going_in_style_short

params:
  length: 10
  trigger: 0.5
  acceleration: 0.06
  first_bar_multp: 2.0
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own ATR / new-low history from the live stream.
  warmup_bars: 0
  live_bars: 120

output:
  print_table: false
  record_signals: false
