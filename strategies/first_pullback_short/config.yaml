# First-PullBack short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy first_pullback_short
#   python run_strategy.py --config strategies/first_pullback_short/config.yaml
#
# Short-only MACD-pullback system: signals are BUY/SELL/HOLD and the
# signal->order meaning is `sell_means: short` (SELL opens the short, BUY covers
# it), same as vwm_short.
#
# This config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL use
#   configs/backtests/first_pullback_short_btcusdt_1m_small.yaml

strategy: first_pullback_short

params:
  fast_ma: 4
  slow_ma: 10
  avg_ma: 16
  atr_len: 10
  entry_atr_pcnt: 1.0
  exit_atr_pcnt: 1.0
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own MACD / ATR history from the live stream.
  warmup_bars: 0
  live_bars: 160

output:
  print_table: false
  record_signals: false
