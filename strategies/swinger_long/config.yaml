# Swinger long — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy swinger_long
#   python run_strategy.py --config strategies/swinger_long/config.yaml
#
# Long-only trend-MA + price-oscillator momentum system: signals are
# BUY/SELL/HOLD and the signal->order meaning is `sell_means: flat` (BUY opens
# the long, SELL flattens it).
#
# NOTE: like the other Vol>0 strategies, this default config has NO execution
# block — the synthetic bar source emits volume=0 so no fills would occur. This
# config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL (volume>0), use
#   configs/backtests/swinger_long_btcusdt_1m_small.yaml

strategy: swinger_long

params:
  fast_ma_length: 5
  slow_ma_length: 20
  trend_ma_length: 50
  exit_stop_n: 3
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own MA / oscillator history from the live stream.
  warmup_bars: 0
  live_bars: 80

output:
  print_table: false
  record_signals: false
