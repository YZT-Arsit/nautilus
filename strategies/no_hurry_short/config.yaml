# No Hurry short — default (synthetic, no-network) run config.
#
#   python run_strategy.py --strategy no_hurry_short
#   python run_strategy.py --config strategies/no_hurry_short/config.yaml
#
# Short-only shifted-channel breakout with an ATR trailing stop: signals are
# BUY/SELL/HOLD and the signal->order meaning is `sell_means: short` (SELL opens
# the short, BUY covers it), same as vwm_short.
#
# This config validates the full data -> features -> signals pipeline. For a REAL
# backtest with fills/PnL use
#   configs/backtests/no_hurry_short_btcusdt_1m_small.yaml

strategy: no_hurry_short

params:
  chan_length: 20
  chan_delay: 15
  trailing_atrs: 3.0
  atr_length: 10
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE

data:
  mode: synthetic
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own channel / ATR history from the live stream.
  warmup_bars: 0
  live_bars: 80

output:
  print_table: false
  record_signals: false
