# MA5 / MA20 crossover — default (synthetic) run configuration.
#
#   python run_strategy.py --strategy ma_crossover
#   python run_strategy.py --config strategies/ma_crossover/config.yaml
#
# `strategy` selects the plugin in strategy_framework/registry.py.
# `params` are passed to that strategy's config dataclass.

strategy: ma_crossover

params:
  fast_window: 5
  slow_window: 20
  input_type: bar
  input_field: close

data:
  mode: synthetic
  instrument_id: BTC/USDT
  warmup_bars: 20
  live_bars: 20

output:
  print_table: true
  record_signals: true
