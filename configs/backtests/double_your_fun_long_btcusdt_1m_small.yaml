# Small-window REAL backtest config: DoubleYourFun long over BTCUSDT spot 1m
# Binance Vision bars, native Nautilus BacktestEngine path.
#
# Single-unit long-only displaced-MA double-crossing breakout (BUY/SELL/HOLD +
# sell_means: flat). Date scope is STRICT: 2026-06-14 .. 2026-06-16 (3 days, 4320
# 1m bars); the hive_parquet_bars loader prunes by date= partition before reading.
#
# Real backtest (writes outputs/backtests/<run_name>/):
#   python run_strategy.py --config configs/backtests/double_your_fun_long_btcusdt_1m_small.yaml

run_name: double_your_fun_long_btcusdt_1m_20260614_20260616
strategy: double_your_fun_long

params:
  avg_length: 5
  avg_displace: 5
  valid_bars1: 5
  valid_bars2: 5
  valid_bars3: 5
  trail_stop_bars: 5
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  warmup_bars: 0
  timestamp_column: ts
  timestamp_unit: ns
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: flat          # BUY opens the long; SELL flattens it
  allow_short: false
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
