# Small-window REAL backtest config: TrendScore short over BTCUSDT spot 1m
# Binance Vision bars, executed through the NATIVE Nautilus BacktestEngine path.
#
# TrendScore_S is a single-unit short-only system (BUY/SELL/HOLD + sell_means:
# short), so it runs on either fill source. Date scope is STRICT:
# 2026-06-14 .. 2026-06-16 (3 days, 4320 1m bars); the hive_parquet_bars loader
# prunes by date= partition before reading.
#
# Dry-run (no backtest):
#   python scripts/dry_run_strategy_config.py \
#       --config configs/backtests/trendscore_short_btcusdt_1m_small.yaml
# Real backtest (writes outputs/backtests/<run_name>/):
#   python run_strategy.py --config configs/backtests/trendscore_short_btcusdt_1m_small.yaml

run_name: trendscore_short_btcusdt_1m_20260614_20260616
strategy: trendscore_short

params:
  look_back: 10
  ma_length: 18
  atr_length: 10
  protect_stop_atr_multi: 0.5
  trail_stop_atr_multi: 3.0
  breakeven_stop_atr_multi: 5.0
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  # The engine builds its own MA/score/ATR history from the live stream.
  warmup_bars: 0
  timestamp_column: ts
  timestamp_unit: ns
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: short         # SELL opens a short; BUY covers it
  allow_short: true
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
