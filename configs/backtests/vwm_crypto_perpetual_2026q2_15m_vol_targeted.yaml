# VWM batch, per-symbol sizing (mode=realized_vol). Generated by
# scripts/build_vwm_sizing_config.py. VWM signal logic UNCHANGED; only the
# per-job order size differs. CAVEAT: funding/liquidation/margin/mark-index
# not modeled; sizing fixed at window start (not rebalanced).

strategy:
  name: vwm
  params:
    mom_len: 5
    avg_len: 20
    atr_len: 5
    atr_pct: 0.5
    setup_len: 5
execution:
  backend: nautilus
  fill_timing: same_bar
  fee_rate: 0.0005
  initial_cash: 100000.0
  quantity: 1.0
  sell_means: short
  allow_short: true
  price_field: close
  slippage_bps: 1.0
data:
  root: historical_data\market_data
  start: '2026-03-01'
  end: '2026-05-31'
  bar_type: 15m
universe:
  include:
  - exchange: BINANCE
    venue_type: futures_um
    symbol: BTCUSDT
    instrument_id: BTCUSDT-PERP.BINANCE
    bar_type: 15m
    quantity: 0.29902786
  - exchange: BINANCE
    venue_type: futures_um
    symbol: ETHUSDT
    instrument_id: ETHUSDT-PERP.BINANCE
    bar_type: 15m
    quantity: 8.80035413
  - exchange: BINANCE
    venue_type: futures_um
    symbol: SOLUSDT
    instrument_id: SOLUSDT-PERP.BINANCE
    bar_type: 15m
    quantity: 194.94175331
  - exchange: BINANCE
    venue_type: futures_um
    symbol: BNBUSDT
    instrument_id: BNBUSDT-PERP.BINANCE
    bar_type: 15m
    quantity: 32.41018328
  exclude: []
output:
  root: outputs/backtests/vwm_crypto_perpetual_2026q2_15m_vol_targeted
  overwrite: false
metadata:
  market_type: crypto_perpetual
  contract_type: usd_m_perpetual
  data_source: binance_vision_futures_um_klines
  sizing_method: realized_vol_target
  caveat: per_symbol_sizing;funding_liquidation_margin_mark_index_not_modeled
