# VWM batch backtest across crypto perpetuals, 15m, recent 2026 Q2 window.
#
# Multi-instrument (BTC/ETH/SOL/BNB) horizontal comparison of ONE strategy (VWM)
# under identical bar_type / window / initial cash / params. The runner applies a
# single global window per invocation, and every symbol here uses the SAME window
# (2026-03-01..2026-05-31), so a single run produces all four jobs into one dir
# with one summary.json -> scripts/build_strategy_batch_eval_table.py then renders
# the boss table (rows = symbol, cols = evaluation metric).
#
# Real 15m OHLCV bars from the public read-only Binance Vision archive
# (data/futures/um/daily/klines/<SYMBOL>/15m). No API key, no private endpoint.
#
# CAVEAT: funding, liquidation, margin, mark/index price NOT modeled. Results are
# for strategy screening / framework validation, not a final performance verdict.

strategy:
  name: vwm
  params:
    mom_len: 5
    avg_len: 20
    atr_len: 5
    atr_pct: 0.5
    setup_len: 5

execution:
  backend: nautilus
  fill_timing: same_bar
  fee_rate: 0.0005
  initial_cash: 100000
  quantity: 1.0
  sell_means: short
  allow_short: true
  price_field: close
  slippage_bps: 1.0

data:
  root: historical_data/market_data
  start: 2026-03-01
  end: 2026-05-31
  bar_type: 15m

universe:
  include:
    - exchange: BINANCE
      venue_type: futures_um
      symbol: BTCUSDT
      instrument_id: BTCUSDT-PERP.BINANCE
      bar_type: 15m
    - exchange: BINANCE
      venue_type: futures_um
      symbol: ETHUSDT
      instrument_id: ETHUSDT-PERP.BINANCE
      bar_type: 15m
    - exchange: BINANCE
      venue_type: futures_um
      symbol: SOLUSDT
      instrument_id: SOLUSDT-PERP.BINANCE
      bar_type: 15m
    - exchange: BINANCE
      venue_type: futures_um
      symbol: BNBUSDT
      instrument_id: BNBUSDT-PERP.BINANCE
      bar_type: 15m
  exclude: []

output:
  root: outputs/backtests/vwm_crypto_perpetual_2026q2_15m_batch
  overwrite: false

metadata:
  market_type: crypto_perpetual
  contract_type: usd_m_perpetual
  data_source: binance_vision_futures_um_klines
  caveat: funding_liquidation_margin_mark_index_not_modeled
