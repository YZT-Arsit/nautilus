run_name: audit_5y_batch/ma_crossover_btcusdt_perp_1m_qty0p001
strategy: ma_crossover

params:
  fast_window: 5
  slow_window: 20
  input_type: bar
  input_field: close

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT-PERP.BINANCE
  warmup_bars: 20
  timestamp_column: ts
  timestamp_unit: ns
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: futures_um
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2021-07-01
  end: 2026-06-30

funding_data:
  mode: hive_parquet_funding
  root: historical_data/market_data
  instrument_id: BTCUSDT-PERP.BINANCE
  timestamp_column: ts
  timestamp_unit: ns
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: futures_um
    symbol: BTCUSDT
    data_type: funding_rate
    freq: settlement
  start: 2021-07-01
  end: 2026-06-30

execution:
  backend: nautilus_backtest
  mode: simulated
  initial_cash: 100000
  quantity: 0.001
  sell_means: flat
  allow_short: false
  price_field: open
  fill_timing: next_bar
  latency_bars: 1
  fee_tier: VIP0
  liquidity_role: taker
  fee_scenarios: [0.0, 0.0005]
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
  record_signals: false
