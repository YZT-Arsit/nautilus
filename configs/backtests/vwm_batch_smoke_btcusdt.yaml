# C1b REAL smoke config: BTCUSDT 1m/5m only, 2026-06-14..2026-06-16.
# Do not use for full-history or CFFEX runs.

strategy:
  name: vwm
  params:
    mom_len: 5
    avg_len: 20
    atr_len: 5
    atr_pct: 0.5
    setup_len: 5

execution:
  backend: nautilus
  fill_timing: same_bar
  fee_rate: 0.0005
  initial_cash: 100000
  quantity: 1.0
  sell_means: short
  allow_short: true
  price_field: close
  slippage_bps: 1.0

data:
  root: historical_data/market_data
  start: 2026-06-14
  end: 2026-06-16

universe:
  include:
    - exchange: BINANCE
      venue_type: spot
      symbol: BTCUSDT
      bar_type: 1m
    - exchange: BINANCE
      venue_type: spot
      symbol: BTCUSDT
      bar_type: 5m
  exclude: []

output:
  root: outputs/backtests/vwm_batch_smoke
  overwrite: false
