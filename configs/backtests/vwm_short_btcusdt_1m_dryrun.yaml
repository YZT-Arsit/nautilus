# Dry-run ONLY config: VWM short over BTCUSDT spot 1m Binance Vision bars.
#
# Validates config parsing + data loading + strategy/feature resolution WITHOUT
# running any backtest and WITHOUT entering the Nautilus BacktestEngine.
#
#   python scripts/dry_run_strategy_config.py \
#       --config configs/backtests/vwm_short_btcusdt_1m_dryrun.yaml
#
# A real backtest would instead use:
#   python run_strategy.py --config configs/backtests/vwm_short_btcusdt_1m_dryrun.yaml
# (NOT part of this dry-run phase.)

run_name: vwm_short_btcusdt_1m_dryrun
strategy: vwm_short

params:
  mom_len: 5
  avg_len: 20
  atr_len: 5
  atr_pcnt: 0.5
  setup_len: 5
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  warmup_bars: 0
  # Binance Vision writes the bar open time as a datetime column named 'ts'.
  timestamp_column: ts
  timestamp_unit: ns        # ignored for datetime columns; must still be valid
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  # Partition pruning: read only BTCUSDT 1m spot.
  filters:
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    bar_type: 1m
  # Dry-run small window — per-date physical reads (2026-06-14..16 = 3 days).
  # These keys are dry-run only; the production loader ignores unknown keys.
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: short
  allow_short: true
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
