# Small-window REAL backtest config: Spread Channel Breakout short over BTCUSDT
# spot 1m Binance Vision bars, native Nautilus BacktestEngine path.
#
# Single-unit short-only spread channel-breakout system (BUY/SELL/HOLD +
# sell_means: short). Date scope is STRICT: 2026-06-14 .. 2026-06-16 (3 days,
# 4320 1m bars); the hive_parquet_bars loader prunes by date= partition before
# reading.
#
# TWO-LEG NOTE: the single-symbol runner feeds BTCUSDT's own open/close as the
# spread series (the engine runs the identical channel-breakout maths). A true
# two-instrument spread source is not yet wired into the runner.
#
# Real backtest (writes outputs/backtests/<run_name>/):
#   python run_strategy.py --config configs/backtests/spread_channel_breakout_short_btcusdt_1m_small.yaml

run_name: spread_channel_breakout_short_btcusdt_1m_20260614_20260616
strategy: spread_channel_breakout_short

params:
  length: 20
  stop_len: 10
  lots0: 1.0
  lots1: 1.0
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  warmup_bars: 0
  timestamp_column: ts
  timestamp_unit: ns
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: short         # SELL opens a short; BUY covers it
  allow_short: true
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
