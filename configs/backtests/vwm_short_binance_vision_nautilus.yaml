# VWM short over REAL Binance Vision bars, executed through the NATIVE Nautilus
# BacktestEngine path.
#
# Prereq (one day of real data, ingested to Hive Parquet):
#   python scripts/ingest_binance_vision.py \
#       --market spot --symbol BTCUSDT --interval 5m --frequency daily \
#       --start 2024-06-01 --end 2024-06-01 \
#       --output historical_data/market_data --overwrite
#
# Run:
#   python run_strategy.py --config configs/backtests/vwm_short_binance_vision_nautilus.yaml
#
# Full chain:
#   Binance Vision ZIP/CSV -> StandardBar -> Hive Parquet
#     -> data_engine (hive_parquet_bars -> BarEvent)
#     -> feature_engine (FeatureSpec -> BackendRegistry -> PythonBackend; OHLCV passthrough)
#     -> vwm_short strategy (Mode B: vwm_features_v1 FeaturePipeline -> StrategyRuntimeContext)
#     -> SignalToOrderPolicy (BUY/SELL/HOLD -> OrderIntent; sell_means=short)
#     -> NautilusBacktestBackend(mode=nautilus_native)
#     -> Nautilus BacktestEngine (real matching / fills / MARGIN account)
#     -> outputs/backtests/<run_name>/ (signals, intents, fills, trades,
#        positions, equity_curve, metrics.json, report.md)

run_name: vwm_short_binance_vision_nautilus
strategy: vwm_short

params:
  mom_len: 5
  avg_len: 20
  atr_len: 5
  atr_pcnt: 0.5
  setup_len: 5
  instrument_id: BTCUSDT.BINANCE
  bar_type: 5m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  # Label for the BarEvents / native instrument mapping (see nautilus_native.py).
  instrument_id: BTCUSDT.BINANCE
  # The whole day is the live stream; the VWM engine warms up on it (avg_len=20).
  warmup_bars: 0
  # Binance Vision writes the bar open time as a datetime column named 'ts'.
  timestamp_column: ts
  timestamp_unit: ns        # ignored for datetime columns; must still be valid
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  # Partition pruning: read only BTCUSDT 5m spot.
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 5m

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: short         # SELL opens a short; BUY closes it
  allow_short: true         # MARGIN account so shorts are permitted
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false        # the backend writes a full report directory instead
