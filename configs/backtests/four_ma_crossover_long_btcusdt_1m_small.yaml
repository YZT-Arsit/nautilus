# Small-window REAL backtest config: Four-MA Crossover long over BTCUSDT spot 1m
# Binance Vision bars, native Nautilus BacktestEngine path.
#
# Single-unit long-only four-moving-average system (BUY/SELL/HOLD + sell_means:
# flat). Date scope is STRICT: 2026-06-14 .. 2026-06-16 (3 days, 4320 1m bars);
# the hive_parquet_bars loader prunes by date= partition before reading.
#
# Real backtest (writes outputs/backtests/<run_name>/):
#   python run_strategy.py --config configs/backtests/four_ma_crossover_long_btcusdt_1m_small.yaml

run_name: four_ma_crossover_long_btcusdt_1m_20260614_20260616
strategy: four_ma_crossover_long

params:
  le_fast: 5
  le_slow: 20
  lx_fast: 3
  lx_slow: 10
  se_fast: 5
  se_slow: 20
  sx_fast: 3
  sx_slow: 10
  min_bars: 100
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  warmup_bars: 0
  timestamp_column: ts
  timestamp_unit: ns
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: flat          # BUY opens the long; SELL flattens it
  allow_short: false
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
