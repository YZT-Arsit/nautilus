# C2d REAL smoke config: 4 CFFEX derived quote-mid 1m bars, 2023-01-03 only.
# These bars are derived from quote mid-prices, not trade OHLCV.

strategy:
  name: vwm
  params:
    mom_len: 5
    avg_len: 20
    atr_len: 5
    atr_pct: 0.5
    setup_len: 5

execution:
  backend: nautilus
  fill_timing: same_bar
  fee_rate: 0.0005
  initial_cash: 100000
  quantity: 1.0
  sell_means: short
  allow_short: true
  price_field: close
  slippage_bps: 1.0

data:
  root: outputs/derived_market_data/cffex_mid_bars_c2d_smoke
  start: 2023-01-03
  end: 2023-01-03

universe:
  include:
    - exchange: CFFEX
      venue_type: futures
      symbol: IF2303
      bar_type: 1m
    - exchange: CFFEX
      venue_type: futures
      symbol: IH2303
      bar_type: 1m
    - exchange: CFFEX
      venue_type: futures
      symbol: IC2303
      bar_type: 1m
    - exchange: CFFEX
      venue_type: futures
      symbol: IM2303
      bar_type: 1m
  exclude: []

output:
  root: outputs/backtests/cffex_vwm_midbar_smoke_c2d
  overwrite: false

metadata:
  data_note: quote_mid_derived_bar_not_trade_ohlcv
  volume_policy: volume_equals_quote_update_count
  bar_source: quote_mid
