# Small-window REAL backtest config: JailBreak short over BTCUSDT spot 1m
# Binance Vision bars, native Nautilus BacktestEngine path.
#
# Single-unit short-only price-range (channel) breakout (BUY/SELL/HOLD +
# sell_means: short). Date scope is STRICT: 2026-06-14 .. 2026-06-16 (3 days,
# 4320 1m bars); the hive_parquet_bars loader prunes by date= partition before
# reading.
#
# Real backtest (writes outputs/backtests/<run_name>/):
#   python run_strategy.py --config configs/backtests/jailbreak_short_btcusdt_1m_small.yaml

run_name: jailbreak_short_btcusdt_1m_20260614_20260616
strategy: jailbreak_short

params:
  length1: 50
  length2: 30
  ips: 4.0
  atr_val: 10
  tick: 0.01
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  warmup_bars: 0
  timestamp_column: ts
  timestamp_unit: ns
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: short         # SELL opens the short; BUY covers it
  allow_short: true
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
