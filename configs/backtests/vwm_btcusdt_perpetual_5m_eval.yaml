# Single-symbol BTCUSDT USD-M perpetual VWM evaluation config.
# Real traded 5m OHLCV bars from the public read-only Binance Vision archive
# (data/futures/um/daily/klines/BTCUSDT/5m). One job only, by design.
#
# CAVEAT: funding, liquidation, margin, and mark/index price effects are NOT
# modeled. This run validates the data->backtest->metrics loop and gives a
# first-pass screen, not a final performance verdict.

strategy:
  name: vwm
  params:
    mom_len: 5
    avg_len: 20
    atr_len: 5
    atr_pct: 0.5
    setup_len: 5

execution:
  backend: nautilus
  fill_timing: same_bar
  fee_rate: 0.0005
  initial_cash: 100000
  quantity: 1.0
  sell_means: short
  allow_short: true
  price_field: close
  slippage_bps: 1.0

data:
  root: historical_data/market_data
  start: 2024-06-01
  end: 2024-06-07

universe:
  include:
    - exchange: BINANCE
      venue_type: futures_um
      symbol: BTCUSDT
      instrument_id: BTCUSDT-PERP.BINANCE
      bar_type: 5m
  exclude: []

output:
  root: outputs/backtests/vwm_btcusdt_perpetual_5m_eval
  overwrite: false

metadata:
  market_type: crypto_perpetual
  contract_type: usd_m_perpetual
  data_source: binance_vision_futures_um_klines
  caveat: funding_liquidation_margin_mark_index_not_modeled
