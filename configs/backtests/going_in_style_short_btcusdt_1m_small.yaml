# Small-window REAL backtest config: Going in Style short over BTCUSDT spot 1m
# Binance Vision bars, native Nautilus BacktestEngine path.
#
# Single-unit short-only new-low-pullback entry with a parabolic-SAR trailing
# stop (BUY/SELL/HOLD + sell_means: short). Date scope is STRICT: 2026-06-14 ..
# 2026-06-16 (3 days, 4320 1m bars); the hive_parquet_bars loader prunes by
# date= partition before reading.
#
# Real backtest (writes outputs/backtests/<run_name>/):
#   python run_strategy.py --config configs/backtests/going_in_style_short_btcusdt_1m_small.yaml

run_name: going_in_style_short_btcusdt_1m_20260614_20260616
strategy: going_in_style_short

params:
  length: 10
  trigger: 0.5
  acceleration: 0.06
  first_bar_multp: 2.0
  instrument_id: BTCUSDT.BINANCE
  bar_type: 1m

data:
  mode: hive_parquet_bars
  root: historical_data/market_data
  instrument_id: BTCUSDT.BINANCE
  warmup_bars: 0
  timestamp_column: ts
  timestamp_unit: ns
  open_column: open
  high_column: high
  low_column: low
  close_column: close
  volume_column: volume
  filters:
    asset_class: crypto
    exchange: BINANCE
    venue_type: spot
    symbol: BTCUSDT
    data_type: bar
    freq: 1m
  start: 2026-06-14
  end: 2026-06-16

execution:
  backend: nautilus_backtest
  mode: nautilus_native
  initial_cash: 100000
  quantity: 1.0
  sell_means: short         # SELL opens the short; BUY covers it
  allow_short: true
  price_field: close
  fee_rate: 0.0005
  slippage_bps: 1.0

output:
  root: outputs/backtests
  print_table: false
